<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lumera — Learn Psychology</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div class="bg-blob-a"></div><div class="bg-blob-b"></div>
  <div class="tb" id="TB">
    <div id="TBL" class="logo-row" onclick="P('landing')">
      <div class="lmark" style="display:flex;align-items:center;justify-content:center"><svg width="22" height="19" viewBox="0 0 56 48" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lmg" x1="2" y1="46" x2="52" y2="2" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#7c59f4"/><stop offset="100%" stop-color="#c8b4fc"/></linearGradient></defs><path d="M 13 3 C -3 9 -3 39 13 45 C 9 41 7 34 8 24 C 7 14 9 7 13 3 Z" fill="url(#lmg)"/><path d="M 21 11 C 17 9 13 12 13 18 C 12 22 15 24 14 28 C 13 33 13 37 17 40 C 21 43 28 43 34 40 C 39 37 42 31 41 24 C 40 17 35 12 29 11 C 27 8 24 9 21 11 Z" fill="url(#lmg)"/><path d="M 26 13 C 25 18 25 24 25 30 C 24 34 23 37 22 40" stroke="#0e0b20" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M 20 17 C 18 21 18 27 19 32" stroke="#0e0b20" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M 23 14 C 21 19 21 25 22 30" stroke="#0e0b20" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M 31 13 C 33 17 34 24 33 30" stroke="#0e0b20" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M 36 15 C 38 20 39 26 37 32" stroke="#0e0b20" stroke-width="1.7" stroke-linecap="round" fill="none"/><line x1="37" y1="14" x2="43" y2="7" stroke="url(#lmg)" stroke-width="1.8" stroke-linecap="round"/><circle cx="44" cy="6" r="2.8" fill="white"/><circle cx="44" cy="6" r="5" fill="white" opacity="0.2"/></svg></div>
      <span class="lname fd" style="background:linear-gradient(135deg,#c4b5fd,#9b7ff4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Lumera</span>
    </div>
    <div class="tb-right" id="TBR">
      <div class="lang-sw">
        <button class="lb on" data-l="en" onclick="SL('en')">&#x1F1EC;&#x1F1E7; EN</button>
        <button class="lb" data-l="de" onclick="SL('de')">&#x1F1E9;&#x1F1EA; DE</button>
      </div>
    </div>
  </div>
  <div class="pages">
    <div class="page bare on" id="p-landing"><div id="landC"></div></div>
    <div class="page bare" id="p-login"><div id="loginC"></div></div>
    <div class="page bare" id="p-signup"><div id="signupC"></div></div>
    <div class="page bare" id="p-onboarding"><div id="obC" style="min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1"></div></div>
    <div class="page" id="p-dashboard"><div id="dashC" style="padding:20px"></div></div>
    <div class="page" id="p-courses"><div id="coursesC" style="padding:20px 20px 0"></div></div>
    <div class="page" id="p-course-detail"><div id="cdC"></div></div>
    <div class="page" id="p-lesson"><div id="lessonC" style="padding:0"></div></div>
    <div class="page" id="p-progress"><div id="progressC" style="padding:20px 20px 0"></div></div>
    <div class="page" id="p-paywall"><div id="paywallC" style="padding:20px 20px 60px"></div></div>
    <div class="page" id="p-admin"><div id="adminC" style="padding:20px 20px 0"></div></div>
  </div>
  <div class="bnav" id="BN" style="display:none">
    <button class="ntab" onclick="P('dashboard')" data-p="dashboard"><div class="ni">&#x1F3E0;</div><div class="nl" id="nl0">Home</div></button>
    <button class="ntab" onclick="P('courses')" data-p="courses"><div class="ni">&#x1F4DA;</div><div class="nl" id="nl1">Courses</div></button>
    <button class="ntab" onclick="openCurLesson()" data-p="lesson"><div class="ni">&#x25B6;&#xFE0F;</div><div class="nl" id="nl2">Lesson</div></button>
    <button class="ntab" onclick="P('progress')" data-p="progress"><div class="ni">&#x1F4C8;</div><div class="nl" id="nl3">Progress</div></button>
    <button class="ntab" onclick="P('admin')" data-p="admin"><div class="ni">&#x2699;&#xFE0F;</div><div class="nl" id="nl4">Admin</div></button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
